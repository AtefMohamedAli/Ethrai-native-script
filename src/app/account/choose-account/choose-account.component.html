
<GridLayout class="view" >
    
    <ActionBar  visability="collapsed"  class="view" title="j">   </ActionBar>    
   
    <ScrollView  scrollBarIndicatorVisible="false">
      
      <StackLayout>
        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label  text="{{'Back'| L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

     <StackLayout class="logo-login2">
      <Image src="~/images/logo-splash.png" class="" ></Image>
    </StackLayout>

     <StackLayout class="login-page">

          <StackLayout>
              <label  text="{{'chooseaccount' |L }}" class="sign-label"></label>
              <AbsoluteLayout>
                <DropDown width="100%" style="  background-color: #F5F6F7;border-radius: 10;" color="#000000"
                [items]="tenantsSource" hint="{{'chooseaccount' |L }}"
                itemsTextAlignment="center"
                (selectedIndexChanged)="onTenantChange($event)"
                [(ngModel)]="selectedTenant"

                >
               </DropDown> 
               <label text="&#xf078;" class="fas arr-drop" left="10"top="20" style="color: #000;font-size: 14"> </label>
               </AbsoluteLayout>
              <Button  text="{{'LogIn' |L}}"  class="login-btn" style="margin-top: 20;" (tap)="goToTenant()"></Button>
          </StackLayout>

  
     </StackLayout>
  
  
      </StackLayout>
    </ScrollView>
    
  </GridLayout>
