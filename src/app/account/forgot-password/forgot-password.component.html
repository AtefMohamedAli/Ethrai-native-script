<GridLayout class="view" >
    
    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

    <ScrollView  scrollBarIndicatorVisible="false">
      
      <StackLayout>
        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label  text="{{'Back'| L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

        <StackLayout class="forget-back" >
            <label text="&#xf084;" class="fas forget-icon" ></label>
        </StackLayout>

        <StackLayout>
          <label  text="{{'ForgotPassword'| L}}" class="sign-label" style="margin-bottom: 0;"></label>
          <label  text="{{'ForgetPasswordInstructions'| L}}" class="forget-text"></label>

        </StackLayout>

        <StackLayout>
            <label  text="{{ 'EmailOrID'| L}}" class="form-label"></label>
            <TextField   hint="name@example.com" style="placeholder-color:#989BAD" required class="" #mail="ngModel" name="mail" [(ngModel)]="email" [pattern]="test()?idRegex:regex"></TextField>
            <Label text="{{'CheckEmailFormat' | L}}" class="valid-mess" *ngIf="mail.invalid && mail.control.dirty && !test()"></Label>
            <Label text="{{'NatID' | L}}" class="valid-mess" *ngIf="mail.invalid && mail.control.dirty && test()"></Label>

            <Button text="{{'Send' | L}}"  style="margin-top: 20;" class="login-btn" (tap)="SendInstructions(!mail.invalid)" [isEnabled]="!sending"></Button>

        </StackLayout>

          <StackLayout>
          </StackLayout>
  
  
  
      </StackLayout>
    </ScrollView>
  </GridLayout>
