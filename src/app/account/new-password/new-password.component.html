<GridLayout class="view" >
    
    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

    <ScrollView  scrollBarIndicatorVisible="false">
      
      <StackLayout>
        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label  text="Back"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

        <StackLayout class="forget-back" >
            <!-- <label text="&#xf023;" class="fas forget-icon" ></label> -->
            <Image src="~/images/lock.png" width="50" class="" ></Image>

        </StackLayout>

        <StackLayout>
          <label  text="New password" class="sign-label" style="margin-bottom: 0;"></label>
          <label  text="Enter the new password. Obvs, your password has to be personal just to you." class="forget-text"></label>

        </StackLayout>

        <StackLayout>
            <label  text="PASSWORD" class="form-label"></label>
            <TextField   hint="Your Password" style="placeholder-color:#989BAD" secure="true" class="" name="password" ></TextField>
  
            <Button text="Save" style="margin-top: 20;" class="login-btn" ></Button>

        </StackLayout>

          <StackLayout>
          </StackLayout>
  
  
  
      </StackLayout>
    </ScrollView>
  </GridLayout>
