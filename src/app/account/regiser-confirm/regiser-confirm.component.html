<GridLayout class="view" >
    
    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

    <ScrollView  scrollBarIndicatorVisible="false">
      
      <StackLayout>
        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label  text="{{'Back'| L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

        <StackLayout class="forget-back" >
            <label text="&#xf00c;" class="fas forget-icon" ></label>
        </StackLayout>

        <StackLayout>
          <label  text="{{'ConfirmAcc'| L}}" class="sign-label" style="margin-bottom: 0;"></label>
          <label  text="{{'ConfirmAccMsg'| L}}" class="forget-text"></label>

        </StackLayout>

        <StackLayout>

            <Button text="{{'LogIn' | L}}"  style="margin-top: 20;" [nsRouterLink]="['/login-by-mail']" class="login-btn"  ></Button>
          
        </StackLayout>

          <StackLayout>
          </StackLayout>
  
  
  
      </StackLayout>
    </ScrollView>
    <GridLayout rows="auto,auto" verticalAlignment="bottom" style="margin-bottom: 75;">
      <label row="0" text="{{'HaventReceivedALetter' | L}}" class=" d-account" style="text-decoration: none; color: #989BAD; margin-top: 10px;"></label>

      <label row="1" text="{{'SendItAgain' |L}}" class=" guest" style="font-size: 16px; color: #1056A5; text-decoration: underline; margin-top: 30px;" (tap)="resend()"></label>
</GridLayout>
  </GridLayout>
