<ActionBar flat="true" style="background-color: #fff" title="">
    <NavigationButton visibility="collapsed"></NavigationButton>
    <GridLayout columns="*" width="100%">   
        <Label col="0" text="{{'filters'| L}}"  class="page-title text-center"></Label>
        <StackLayout col="0" horizontalAlignment="left" orientation="horizontal" (tap)="goBack()">
            <Image src="~/images/back.png" width="18" class="" ></Image>
            <label  text="{{'Back'| L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
        </StackLayout>   
        <label text="{{'resetpass'| L}}" col="0" (tap)="reset()" style="font-size: 14px; margin: 0 10; color: #1056A5;" horizontalAlignment="right"></label> 
    </GridLayout>
  </ActionBar>

  <GridLayout>
<GridLayout class="view">
   
     <ScrollView  scrollBarIndicatorVisible="false">
       <StackLayout class="page-layout">

               <FlexboxLayout flexDirection="row-reverse"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">

           <!-- <label  text=" الدورات" class="sign-label" style="margin-top:0"></label> -->

           <label  text="{{'sortby'| L}}" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>
    
           <AbsoluteLayout>
            <DropDown width="100%" style=" background-color: #F5F6F7;border-radius: 10;" color="#000000"
            [items]="sortBy"
            itemsTextAlignment="center"
            (selectedIndexChanged)="onSortChange($event)"
            [(ngModel)]="selectedSort"
            >
           </DropDown>
           <label text="&#xf078;" class="fas arr-drop" left="10"top="20" style="color: #000;font-size: 14"> </label>

           </AbsoluteLayout> 

           <label  text="المستوى" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>

           <StackLayout style="margin: 0 0 15;">
                <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom">
                    <CheckBox:CheckBox [checked]="isBeginner" #CB2 (checkedChange)="onLevelCheckChange($event,'Beginner')" />
                    <label class="check-label" text="مبتدئ"></label>
                </FlexboxLayout>

                <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom">
                    <CheckBox:CheckBox  [checked]="isIntermediate" #CB2 (checkedChange)="onLevelCheckChange($event,'Intermediate')" />
                    <label class="check-label" text="متوسط"></label>
                </FlexboxLayout>

                <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom">
                    <CheckBox:CheckBox  [checked]="isAdvanced" #CB2 (checkedChange)="onLevelCheckChange($event,'Advanced')"/>
                    <label class="check-label" text="متقدم"></label>
                </FlexboxLayout>
          </StackLayout>

       <!--   <label  text="اللغة" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>

          <StackLayout style="margin: 0 0 15;">
            <FlexboxLayout flexDirection="row-reverse">
                <CheckBox:CheckBox  checked="true" />
                <label class="check-label" text="العربيه"></label>
            </FlexboxLayout>
            <FlexboxLayout flexDirection="row-reverse">
                <CheckBox:CheckBox  checked="false" />
                <label class="check-label" text="الإنجليزية"></label>
            </FlexboxLayout>
         </StackLayout>-->

         <label  text="السعر" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>

         <StackLayout style="margin: 0 0 15;">
            <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom" *ngFor="let item of priceCategory">
                <CheckBox:CheckBox boxType="circle" [checked]="item.isChecked" #CB (checkedChange)="CB.checked !== item.isChecked && onPriceCheckChange($event,item)" />
                <label class="check-label" text="{{item.text}}"></label>
            </FlexboxLayout>
        </StackLayout>

        <label  text="التقييم" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>

        <StackLayout style="margin: 0 0 15;">
           <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom" *ngFor="let item of ratings">
               <CheckBox:CheckBox boxType="circle" #CB3 [checked]="item.isChecked" (checkedChange)="CB3.checked !== item.isChecked && onRatingChange($event,item)" />
               <label class="check-label" text="{{item.text}}"></label>
           </FlexboxLayout>

       </StackLayout>

       <label  text="المدة" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13"></label>

       <StackLayout style="margin: 0 0 15;">
          <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom" *ngFor="let item of durations">
              <CheckBox:CheckBox boxType="circle" #CB4 [checked]="item.isChecked" (checkedChange)="CB4.checked !== item.isChecked && onPeriodChange($event,item)" />
              <label *ngIf="item.type=='Fixed'" class="check-label" text="{{intl.format(item.min)}}-{{intl.format(item.max)}} ساعة"></label>
              <label *ngIf="item.type=='MinBounded'" class="check-label" text="{{intl.format(item.min)}}  فأكثر"></label>

            </FlexboxLayout>
        </StackLayout>
          <label  text="المنتجات" class="sign-label" style="margin-top:0; margin-bottom: 0; font-size:13" *ngIf="showProductsTypes"></label>

          <StackLayout style="margin: 0 0 15;" *ngIf="showProductsTypes"> 
             <FlexboxLayout flexDirection="row-reverse" class="ioscheck iosbottom" *ngFor="let item of productsType">
                 <CheckBox:CheckBox boxType="circle" #CB5 [checked]="item.isChecked" (checkedChange)="CB5.checked !== item.isChecked && onProductTypeChange($event,item)" />
                 <label class="check-label" text="{{item.text}}"></label>
             </FlexboxLayout>
      </StackLayout>
        <GridLayout style="margin-bottom: 60;"></GridLayout>
       </StackLayout>
    </ScrollView>

        <Button verticalAlignment="bottom"  text="عرض النتائج" class="login-btn" (tap)="showResults()"></Button>

</GridLayout>
</GridLayout>
