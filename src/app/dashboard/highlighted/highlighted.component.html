    <ActionBar flat="true" style="background-color: #fff;" title="">
        <NavigationButton visibility="collapsed"></NavigationButton>
        <GridLayout columns="*,auto,auto" width="100%">
            <AbsoluteLayout col="1" horizontalAlignment="right" *ngIf="isLoggedIn&&isEthrai"
                [nsRouterLink]="['/notifications']">
                <label text="&#xf0f3;" class="fas" style="font-size: 18px; margin: 0 10; color: #000;"></label>
                <label text="{{globalService.unreadNotificationsCount}}"
                    [visibility]="globalService.unreadNotificationsCount>0 ? 'visible' : 'collapsed'"
                    class="cart-badge"></label>
            </AbsoluteLayout>
            <AbsoluteLayout col="2" horizontalAlignment="right" *ngIf="isLoggedIn&&isEthrai"
                [nsRouterLink]="['/shopping-cart']">
                <label text="&#xf07a;" class="fas" style="font-size: 18px; margin: 0 10; color: #000;"></label>
                <label text="{{globalService.shoppinCartItemsCount}}"
                    [visibility]="globalService.shoppinCartItemsCount>0 ? 'visible' : 'collapsed'"
                    class="cart-badge"></label>
            </AbsoluteLayout>
        </GridLayout>
    </ActionBar>

    <ScrollView style="height: 100%;" scrollBarIndicatorVisible="false">
        <StackLayout class="page-layout" style="margin-bottom: 60;">

            <!-- visitor -->
            <GridLayout rows="auto,auto,auto,auto" class="container" *ngIf="!isLoggedIn" style="margin-top:50;">
                <label col="0" text="{{'signinvisit'| L}}" class="sign-label text-center"
                    style="margin-bottom: 0; margin-top: 0;"></label>
                <!-- <label row="0"  text="{{'signinvisit'| L}}" class="sign-label" style="margin-bottom: 0;"></label> -->
                <!-- <label  row="1" text="{{'signinvisittext'| L}}" class="forget-text"></label> -->
                <Button row="2" text="{{'LogIn' | L}}" class="login-btn" style="margin-top: 10;"
                    [nsRouterLink]="['/login']"></Button>
            </GridLayout>
            <!-- endvisitor -->




            <GridLayout rows="auto,auto" class="container" style="margin-top: 5;" *ngIf="isLoggedIn">
                <label row="0" text="{{'hi'|L}} {{firstNameAr}} " class="user-welcome"></label>
                <label row="1" text="{{'weltext'|L}}"
                    style="font-size: 14px; color: #989BAD; font-weight: 500;"></label>
            </GridLayout>

            <!-- =============================== -->
            <!-- HERO IMAGE SLIDER               -->
            <!-- =============================== -->
            <GridLayout class="slider-wrapper" rows="*" [height]="sliderHeight"
                *ngIf="sliderSlides?.length > 0 && currentSlide" (swipe)="onSliderSwipe($event)">
                <!-- Full width, height follows image ratio so sides are not cropped -->
                <Image row="0" src="{{currentSlide.image}}" stretch="aspectFit"
                    horizontalAlignment="stretch" verticalAlignment="stretch"
                    class="slider-full-image">
                </Image>

                <!-- Dot indicators sit inside the image row at the bottom -->
                <StackLayout row="0" orientation="horizontal" horizontalAlignment="center" verticalAlignment="bottom"
                    class="slider-dots-overlay" *ngIf="sliderSlides?.length > 1">
                    <StackLayout *ngFor="let slide of sliderSlides; let i = index"
                        [class.slider-dot-on]="i === activeSlideIndex" [class.slider-dot-off]="i !== activeSlideIndex"
                        (tap)="setSlideIndex(i)">
                    </StackLayout>
                </StackLayout>
            </GridLayout>
            <!-- =============================== -->

            <saudi-divider></saudi-divider>

            <FlexboxLayout *ngIf="isLoggedIn && lastViewedCourses?.length>0" alignItems="center"
                flexDirection="row-reverse"                 style="margin: 12 20 12;" justifyContent="space-between">
                <label text="{{'lastViewed'| L}}" class=" " style="color: #979BAC; font-size: 15;"></label>
            </FlexboxLayout>
            <ActivityIndicator class="spin" [busy]="isLastViewedLoading"></ActivityIndicator>

            <ScrollView *ngIf="isLoggedIn && lastViewedCourses?.length>0" orientation="horizontal"
                scrollBarIndicatorVisible="false" class="rtl" style="margin: 0 20;">
                <WrapLayout orientation="horizontal">
                    <GridLayout rows="auto,auto" class="course-block rtl"
                        *ngFor="let course of lastViewedCourses;let i=index" iosOverflowSafeArea="false">
                        <GridLayout row="0" class="album-image" height="100" width="180"
                            backgroundImage="{{course.imageUrl}}" (tap)="goToCoursePage(course.id,course)"
                            borderRadius="10 10 0 0">
                            <!-- <Image src="{{course.imageUrl}}" class="prof-img" [nsRouterLink]="['/course-details',course.id]"></Image> -->

                            <!--backgroundImage="{{course.imageUrl}}" <label  class=" fav-icon" text="&#xf004;" [ngClass]="course.isFavorite ? 'fas' : 'far'"> </label> -->
                        </GridLayout>
                        <label class=" fav-icon fas" text="&#xf004;" horizontalAlignment="right" width="26" height="26"
                            style=" font-size: 18; vertical-align: top; z-index: 99999;"
                            [ngClass]="course &&course.isFavorite ? 'fav-blue' : 'fav-white'"
                            (tap)="setFavoriteLVC(course?.id,'course',course?.isFavorite,i)"> </label>

                        <StackLayout row="1" class="course-details" (tap)="goToCoursePage(course.id,course)">
                            <Label textWrap="false" class="course-na" text="{{course.nameAr}}"></Label>
                            <FlexboxLayout *ngIf="course?.rating" flexDirection="row-reverse" alignItems="center"
                                justifyContent="flex-start" margin="-5 0">
                                <label text="&#xf005;" class="fas rate-icon"
                                     *ngFor="let i of [].constructor(Math.round(course.rating))"></label>
                            </FlexboxLayout>
                            <FlexboxLayout *ngIf="course?.rating==0 ||course?.rating==undefined"
                                flexDirection="row-reverse" alignItems="center" justifyContent="flex-start"
                                margin="-5 0">
                                <label text="&#xf005;" class="far rate-icon"
                                    *ngFor="let i of [].constructor(5)"></label>
                            </FlexboxLayout>
                            <Label class="course-cate" text="{{course.categoryNameAr}}"></Label>
                            <FlexboxLayout flexDirection="row-reverse" alignItems="center"
                                justifyContent="space-between">
                                <price-template [applePrice]="course?.applePrice"
                                    [androidPrice]="course?.price"></price-template>

                                <!-- <AnimatedCircle *ngIf="course.attendedSeconds &&course.attendedSeconds&lt;course.numberOfSeconds" backgroundColor="transparent" width="25" height="25" animated="true" animateFrom="0" rimColor="#1056A5" barColor="#999" rimWidth="6"  [progress]="getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)" text="{{getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)}}" textSize="25" textColor="#1056A5"></AnimatedCircle> -->
                                <Label *ngIf="course.attendedSeconds &&course.attendedSeconds&lt;course.numberOfSeconds"
                                    text="{{getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)}}"
                                    class="fas cert" style="font-size: 13;"></Label>

                                <Label text="&#xf559;" class="fas cert"
                                    *ngIf="course.numberOfSeconds &&course.attendedSeconds&gt;=course.numberOfSeconds"></Label>
                            </FlexboxLayout>
                        </StackLayout>
                    </GridLayout>

                    <StackLayout class="course-block rtl" iosOverflowSafeArea="false">
                        <GridLayout class="album-image" height="180" width="180">
                            <label class="view-all-btn" text="{{'viewall' |L}}" textAlignment="center"
                                [nsRouterLink]="['/training-program-list','lastViewed']" *ngIf="!isLastViewedLoading"
                                [screenName]="'last_viewed_courses'"></label>
                        </GridLayout>
                    </StackLayout>

                </WrapLayout>
            </ScrollView>

            <saudi-divider *ngIf="isLoggedIn && lastViewedCourses?.length>0"></saudi-divider>

                    </FlexboxLayout>

                </WrapLayout>
            </ScrollView>

                    </GridLayout>

                </WrapLayout>

                    <GridLayout rows="auto,auto" class="course-block rtl" iosOverflowSafeArea="false"

                        <GridLayout row="0" class="album-image" height="100" width="180"
                            backgroundImage="{{course.imageUrl}}" (tap)="goToCoursePage(course.id,course)"
                            borderRadius="10 10 0 0">
                            <!-- <Image src="{{course.imageUrl}}" class="prof-img" [nsRouterLink]="['/course-details',course.id]"></Image> -->

                            <!-- <label  class=" fav-icon" text="&#xf004;" [ngClass]="course.isFavorite ? 'fas' : 'far'"> </label> -->
                        </GridLayout>
                        <label class=" fav-icon fas" horizontalAlignment="right" text="&#xf004;" width="26" height="26"
                            style=" font-size: 18; vertical-align: top; z-index: 99999;"
                            [ngClass]="course &&course.isFavorite ? 'fav-blue' : 'fav-white'"
                            (tap)="setFavoriteHRC(course?.id,'course',course?.isFavorite,i)"> </label>

                        <StackLayout row="1" class="course-details" (tap)="goToCoursePage(course.id,course)">
                            <Label textWrap="false" class="course-na" text="{{course.nameAr}}"></Label>
                            <FlexboxLayout *ngIf="course?.rating" flexDirection="row-reverse" alignItems="center"
                                justifyContent="flex-start" margin="-5 0">
                                <label text="&#xf005;" class="fas rate-icon"
                                    *ngFor="let i of [].constructor(Math.round(course.rating))"></label>
                            </FlexboxLayout>
                            <FlexboxLayout *ngIf="course?.rating==0 ||course?.rating==undefined"
                                flexDirection="row-reverse" alignItems="center" justifyContent="flex-start"
                                margin="-5 0">
                                <label text="&#xf005;" class="far rate-icon"
                                    *ngFor="let i of [].constructor(5)"></label>
                            </FlexboxLayout>
                            <Label class="course-cate" text="{{course.categoryNameAr}}"></Label>
                            <FlexboxLayout flexDirection="row-reverse" alignItems="center"
                                justifyContent="space-between">
                                <price-template [applePrice]="course?.applePrice"
                                    [androidPrice]="course?.price"></price-template>

                                <!-- <AnimatedCircle *ngIf="course.attendedSeconds &&course.attendedSeconds&lt;course.numberOfSeconds" backgroundColor="transparent" width="25" height="25" animated="true" animateFrom="0" rimColor="#1056A5" barColor="#999" rimWidth="6"  [progress]="getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)" text="{{getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)}}" textSize="25" textColor="#1056A5"></AnimatedCircle> -->
                                <Label *ngIf="course.attendedSeconds &&course.attendedSeconds&lt;course.numberOfSeconds"
                                    text="{{getCourseProgressPercent(course.attendedSeconds,course.numberOfSeconds)}}"
                                    class="fas cert" style="font-size: 13;"></Label>

                                <Label text="&#xf559;" class="fas cert"
                                    *ngIf="course.numberOfSeconds &&course.attendedSeconds&gt;=course.numberOfSeconds"></Label>
                            </FlexboxLayout>
                        </StackLayout>
                    </GridLayout>

                    <StackLayout class="course-block rtl" iosOverflowSafeArea="false">
                        <GridLayout class="album-image" height="180" width="180">
                            <label class="view-all-btn" text="{{'viewall' |L}}" textAlignment="center"
                                [nsRouterLink]="['/training-program-list','highlyRated']" *ngIf="!isHighlyRatedLoading"
                                [screenName]="'highly_rated_courses'"></label>
                        </GridLayout>
                    </StackLayout>

                </WrapLayout>
            </ScrollView>

            <saudi-divider *ngIf="highlyRatedCourses?.length>0"></saudi-divider>

            <GridLayout rows="auto,auto,auto,auto" class="partener-back  album-image "
                backgroundImage="~/images/partner.png" style=" margin: 30 20 0; border-radius: 20 20 0 0;">
                <label row="0" text="{{'bePartner' | L}}" class="part-label"></label>
                <!--<HtmlView row="1" html="{{ htmlString }}" class=""  horizontalAlignment="right" width="100%" color="#fff"></HtmlView>-->
                <label row="1" text="{{bepart?.split('.').join('. ')}}" horizontalAlignment="right"
                    style="font-size: 14;" color="#fff"></label>
                <label row="2" text="مزيد من المعلومات" style="margin-top: 20;" class="part-btn"
                    [nsRouterLink]="['/become-partner']"></label>
            </GridLayout>
