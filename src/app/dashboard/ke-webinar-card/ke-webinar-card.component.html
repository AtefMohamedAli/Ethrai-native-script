<GridLayout   class="cr-list-item" rows="auto" columns="*,100" >
    <GridLayout row="0" col="2"  class="album-image" (tap)="goToProduct(product?.id)" backgroundImage="{{product?.imageUrl}}" verticalAlignment="top"  style=" border-radius: 10; width: 100; height: 100;">
    <!-- <Image  style=" border-radius: 10;" src="{{product?.imageUrl}}" (tap)="goToProduct(product?.id)"></Image>   -->
   </GridLayout>

    <WrapLayout row="0" col="0" orientation="vertical" verticalAlignment="top" style="margin:0 10 0 0">
        <GridLayout   class=""  columns="auto, *">
          <Label  col="1" textWrap="true" class="course-na" text="{{product?.nameAr}}" (tap)="goToProduct(product?.id)" ></Label>
          <label  col="0"  class="" text="&#xf004;"  style="color: #1056A5; font-size: 18px; width: 33; height: 33;" [ngClass]="product?.isFavorite ? 'fas' : 'far'" (tap)="setFavorite(product?.id,product?.isFavorite)"> </label>
        </GridLayout>
     <FlexboxLayout flexDirection="row-reverse" flexWrap="wrap" alignItems="center" justifyContent="flex-start" (tap)="goToProduct(product?.id)">
        <label *ngIf="productType!='Ke'"  class=" path-icon fas" text="&#xf017;"> </label>
        <Label  class="path-date" text="{{date}}" ></Label>

     </FlexboxLayout>
     <FlexboxLayout flexDirection="row-reverse"  alignItems="center" justifyContent="flex-start">
        <label  text="&#xf005;" [ngClass]="product?.rating ? 'fas' : 'far'"  class="rate-icon" *ngFor="let i of [].constructor(rating)"></label>
    </FlexboxLayout>


     <!--<Label class="class-desc" text="{{getText(product?.descriptionAr)}}" *ngIf="productType=='Webinar' &&screenName !='search_result'"></Label>-->
     <Label  class="course-cate" text="{{'webinars' |L}}" *ngIf="showType && productType=='Webinar'"></Label>    
     <Label  class="course-cate" text="{{'KnowledgeEnrichment' |L}}" *ngIf="showType && productType=='Ke'"></Label>    

 </WrapLayout>


<!--   <FlexboxLayout row="1" colspan="2" flexDirection="row-reverse"  alignItems="center" justifyContent="space-between">
     <Button  text="{{'webinarEnroll' |L}}"  class="class-btn" *ngIf="item" (tap)="enrollToWebinar()"></Button>
     <Button  text="{{'goToWebinar' |L}}"  class="class-btn-b"></Button>    
     </FlexboxLayout> -->
</GridLayout>
