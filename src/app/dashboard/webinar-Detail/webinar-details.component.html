<GridLayout class="whiteback">

  <GridLayout verticalAlignment="top" class="top-bar">
    <FlexboxLayout flexDirection="row" alignItems="center" justifyContent="space-between">

      <StackLayout orientation="horizontal" alignItems="center" (tap)="goBack()">
        <Image src="~/images/back.png" width="18" class=""></Image>
        <label text="{{'Back'| L}}" style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
      </StackLayout>

    </FlexboxLayout>
  </GridLayout>

  <GridLayout verticalAlignment="top" style="margin-top: 70;">
    <!--<StackLayout *ngIf="webinar?.webinar?.videoUrl == ''" class="album-image" height="250" style="margin-top: 0; background-color: #f3f4f5; padding: 20;"  borderRadius="20 20 0 0">
            <Image  row="0" col="1"  src="{{webinar?.webinar.imageUrl}}"></Image>
        </StackLayout>-->

    <StackLayout class="album-image" height="300" style="margin-top: 0; padding: 20;" width="100%"
      backgroundImage="{{webinar?.webinar?.imageUrl}}" *ngIf="!isLoading &&!urlProtected " borderRadius="20 20 0 0">
      <label text="{{'IsLive'| L}}" *ngIf="showLiveButton"
        style="color: rgb(75, 71, 71);font-size: 15; text-align: center; margin-top: 50;"></label>
      <label text="{{webinar?.webinar.startDate |date:'short'}} {{'StartsOn' |L}}"
        *ngIf="showAlredyEnrolledButton ||showEnrollButton"
        style="color: #fff;font-size: 15; text-align: center; margin-top: 50;"></label>
      <label text="{{'ToUploadSoon'| L}}" *ngIf="showFinishedButton"
        style="color: rgb(75, 71, 71);font-size: 15; text-align: center; margin-top: 50;"></label>
    </StackLayout>

    <GridLayout height="300" *ngIf="urlProtected  && !isLoading">
      <WebView (loadFinished)="onLoadFinishedAliBaba($event)"></WebView>
    </GridLayout>
  </GridLayout>

  <ActionBar visability="collapsed" class="view" title=""> </ActionBar>


  <StackLayout class="page-layout" style="margin-top: 370;">

    <ActivityIndicator *ngIf="isLoading" [busy]="isLoading"></ActivityIndicator>

    <MDTabs selectedIndex="1">
      <!-- The bottom tab UI is created via TabStrip (the containier) and TabStripItem (for each tab)-->
      <MDTabStrip>
        <MDTabStripItem>
          <Label text="عن المؤتمر"></Label>
          <!-- <Image src="font://&#xf015;" class="fas"></Image> -->
        </MDTabStripItem>
      </MDTabStrip>

      <!-- The number of TabContentItem components should corespond to the number of TabStripItem components -->
      <MDTabContentItem>
        <GridLayout>
          <ScrollView style="height: 100%;" scrollBarIndicatorVisible="false">

            <StackLayout>
              <!--course name collapse-->
              <StackLayout style="margin-top: 20;" class="container">
                <FlexboxLayout horizontalAlignment="right" (tap)="clickme(item)"
                  [visibility]="clickedd == item ? 'collapsed' : 'visible'" flexDirection="row"
                  justifyContent="space-between">
                  <GridLayout (tap)="clickme(item)" columns="auto, *" class="bookmark-collapse">
                    <Label col="0" text="&#xf107;" class="fas arr-drop" style="color: #000; width: 20;"></Label>
                    <Label col="1" horizontalAlignment="right" text='{{webinar?.webinar?.nameAr}}'
                      class="bookmark-course"></Label>
                  </GridLayout>
                </FlexboxLayout>
                <FlexboxLayout horizontalAlignment="right" [visibility]="clickedd == item ? 'visible' : 'collapsed'"
                  flexDirection="column">
                  <GridLayout (tap)="uclickme(item)" columns="auto, *" class="bookmark-collapse ">
                    <Label col="0" text="&#xf106;" class="fas arr-drop" style="color:#1056A5;width: 20;"></Label>
                    <Label col="1" horizontalAlignment="right" text='{{webinar?.webinar?.nameAr}}'
                      class="bookmark-course"></Label>
                  </GridLayout>

                  <Label class="course-cate" style="color:#989bad;font-size: 13;"
                    text="{{getText(webinar?.webinar?.descriptionAr)}}"></Label>

                </FlexboxLayout>
              </StackLayout>
              <!-- end course name collapse-->

              <StackLayout>
                <label class="line" style="margin: 20 20;"></label>
              </StackLayout>

              <!--autor name -->
              <GridLayout *ngFor="let instructor of webinar?.experts" class="cr-list-item" rows="auto" columns="*,100"
                [nsRouterLink]="['/WebinarInstructor',instructor.id]">
                <Image row="0" col="1" *ngIf="instructor.imageUrl!=null ||instructor.imageUrl!=''"
                  src="{{instructor.imageUrl}}" class="ins-img"></Image>
                <label text="&#xf2bd;" class="far " style="font-size: 70px; color: #989BAD;"
                  *ngIf="instructor.imageUrl==null ||instructor.imageUrl==''"></label>

                <StackLayout row="0" col="0" orientation="vertical" style=" margin: 0 10;">
                  <Label class="ins-name" text="{{instructor.nameAr}}"></Label>
                  <Label class="ins-desc" text="خبير"></Label>
                </StackLayout>
              </GridLayout>
              <!-- end autor name -->

              <StackLayout *ngIf="webinar?.experts?.length>0">
                <label class="line" style="margin: 10 20;"></label>
              </StackLayout>

              <!--course data -->
              <StackLayout>
                <FlexboxLayout flexDirection="row-reverse" class="container" alignItems="center"
                  justifyContent="space-between">
                  <label text="{{'duration'| L}}" class="c-prop"></label>
                  <label text="{{intl.format(durationHours)}} ساعة {{intl.format(durationMinutes)}} دقيقة"
                    class="c-val plainfont"></label>
                </FlexboxLayout>
                <!--<FlexboxLayout flexDirection="row-reverse" class="container"   alignItems="center" justifyContent="space-between">
              <label  text="{{'level'| L}}" class="c-prop" ></label>
              <label  text="{{course?.course?.level | L}}" class="c-val plainfont" ></label>
            </FlexboxLayout>-->
                <!--   <FlexboxLayout flexDirection="row-reverse" class="container"   alignItems="center" justifyContent="space-between">
              <label  text="{{'language'| L}}" class="c-prop" ></label>
              <label  text="العربية " class="c-val plainfont" ></label>
            </FlexboxLayout>
            <FlexboxLayout flexDirection="row-reverse" class="container"   alignItems="center" justifyContent="space-between">
              <label  text="{{'subtitle'| L}}" class="c-prop" ></label>
              <label  text="العربيه , English" class="c-val plainfont" ></label>
            </FlexboxLayout>
            <FlexboxLayout flexDirection="row-reverse" class="container"   alignItems="center" justifyContent="space-between">
              <label  text="{{'dateofpublication'| L}}" class="c-prop" ></label>
              <label  text="{{course.course?.publishDate | date:'short'}}" class="c-val plainfont" ></label>
            </FlexboxLayout>-->
              </StackLayout>
              <!-- end course data -->

              <StackLayout>
                <label class="line" style="margin: 20 20;"></label>
              </StackLayout>


              <!--course reviews collapse -->
              <StackLayout class="container">
                <FlexboxLayout horizontalAlignment="right" (tap)="clickme1(item)"
                  [visibility]="clickedd1 == item ? 'collapsed' : 'visible'" flexDirection="row"
                  justifyContent="space-between">
                  <GridLayout (tap)="clickme1(item)" columns="auto, *" class="bookmark-collapse">
                    <Label col="1" text="&#xf107;" class="fas arr-drop" style="color: #000"></Label>
                    <Label col="1" horizontalAlignment="right" text="{{'reviews'| L}}" class="bookmark-course"></Label>
                  </GridLayout>
                </FlexboxLayout>
                <FlexboxLayout horizontalAlignment="right" [visibility]="clickedd1 == item ? 'visible' : 'collapsed'"
                  flexDirection="column">
                  <GridLayout (tap)="uclickme1(item)" columns="auto, *" class="bookmark-collapse ">
                    <Label col="1" text="&#xf106;" class="fas arr-drop" style="color:#1056A5"></Label>
                    <Label col="1" horizontalAlignment="right" text="{{'reviews'| L}}" class="bookmark-course"></Label>
                  </GridLayout>


                  <ScrollView orientation="horizontal" class="rtl" scrollBarIndicatorVisible="false">
                    <StackLayout orientation="horizontal">
                      <StackLayout *ngFor="let feed of feedbacks" iosOverflowSafeArea="false"
                        flexDirection="row-reverse" class="review-back rtl" width="250" alignItems="center"
                        justifyContent="space-between" flexWrap="wrap">
                        <label text="{{feed.createdBy?.fullNameAr}}" class="c-prop"></label>
                        <FlexboxLayout *ngIf="feed?.rating" flexDirection="row-reverse" style="margin: 8 0;"
                          alignItems="center" justifyContent="flex-start">
                          <label text="&#xf005;" class="fas rate-icon"
                            *ngFor="let i of [].constructor(Math.round(feed.rating))"></label>
                        </FlexboxLayout>
                        <FlexboxLayout *ngIf="feed?.rating==0 ||feed?.rating==undefined" style="margin: 8 0;"
                          flexDirection="row-reverse" alignItems="center" justifyContent="flex-start">
                          <label text="&#xf005;" class="far rate-icon" *ngFor="let i of [].constructor(5)"></label>
                        </FlexboxLayout>
                        <label text="{{feed.description}}" class="c-val"></label>
                      </StackLayout>
                      <Label text="{{'noFeedback'|L}}" class="rtl" *ngIf="feedbacks?.length==0"></Label>
                    </StackLayout>
                  </ScrollView>
                  <product-feedback (feedback)="showFeedback($event)" *ngIf="showReviewForm&&isLoggedIn"
                    [productType]="'Webinar'" [productId]="webinarId"></product-feedback>


                </FlexboxLayout>
              </StackLayout>
              <!-- end course reviews collapse -->



              <StackLayout>
                <label class="line" style="margin: 20 20;"></label>
              </StackLayout>

              <!--Attachments-->
              <StackLayout class="container">
                <FlexboxLayout horizontalAlignment="right" (tap)="clickme2(webinar)"
                  [visibility]="clickedd2 == webinar ? 'collapsed' : 'visible'" flexDirection="row"
                  justifyContent="space-between">
                  <GridLayout (tap)="clickme2(webinar)" columns="auto, *" class="bookmark-collapse">
                    <Label col="1" text="&#xf107;" class="fas arr-drop" style="color: #000"></Label>
                    <Label col="1" horizontalAlignment="right" text='المرفقات' class="bookmark-course"></Label>
                  </GridLayout>
                </FlexboxLayout>
                <FlexboxLayout horizontalAlignment="right" [visibility]="clickedd2 == webinar ? 'visible' : 'collapsed'"
                  flexDirection="column">
                  <GridLayout (tap)="uclickme2()" columns="auto, *" class="bookmark-collapse ">
                    <Label col="1" text="&#xf106;" class="fas arr-drop" style="color:#1056A5"></Label>
                    <Label col="1" horizontalAlignment="right" text='المرفقات' class="bookmark-course"></Label>
                  </GridLayout>

                  <FlexboxLayout flexDirection="column" style="padding: 10 0;"
                    *ngFor="let webinar of webinar?.webinar?.attachments">
                    <FlexboxLayout flexDirection="row-reverse" alignItems="center" justifyContent="space-between"
                      (tap)="downloadFile(webinar.url)">
                      <label [text]="webinar?.descriptionAr" class="acc-sett"></label>
                      <label class=" path-icon far" text="&#xf358;" style="color:#1056A5 ;font-size: 22;"> </label>
                    </FlexboxLayout>
                    <FlexboxLayout flexDirection="row-reverse" alignItems="center" justifyContent="flex-start">
                      <label text="&#xf1c1;" style="color: #575966;font-size: 18;" class=" far"></label>
                    </FlexboxLayout>
                  </FlexboxLayout>
                  <Label *ngIf="webinar?.webinar?.attachments?.length==0 ||webinar?.webinar?.attachments==undefined"
                    text="{{'NoAttachments' |L}}"></Label>
                </FlexboxLayout>
              </StackLayout>
              <!-- Attachments-->

              <StackLayout>
                <label class="line" style="margin: 20 20;"></label>
              </StackLayout>

              <FlexboxLayout (tap)="shareWebinar()" flexDirection="row-reverse" class=" container" alignItems="center"
                justifyContent="space-between" flexWrap="wrap">
                <label text="{{'shareWebinar'| L}}" class="acc-sett" style="font-size: 16;"></label>
                <label text="&#xf1e0;" class="fas menu-icon" style="color:#1056A5 ; font-size: 18;"></label>
              </FlexboxLayout>

              <!--  <StackLayout>
          <label class="line" style="margin: 20 20;"></label>
         </StackLayout> -->




              <GridLayout height="80"></GridLayout>

            </StackLayout>

          </ScrollView>
        </GridLayout>
      </MDTabContentItem>

    </MDTabs>


  </StackLayout>

  <GridLayout verticalAlignment="bottom" columns="auto, *" style="background-color: #fff; padding: 10 20;"
    class="iosstyle">
    <Button col="1" text="{{'goToWebinar' |L}}" class="class-btn" *ngIf="showLiveButton" (tap)="goToWebinar()"></Button>
    <Button col="1" text="{{'webinarEnroll' |L}}" class="class-btn" (tap)="enrollToWebinar()"
      *ngIf="showEnrollButton"></Button>
    <Button col="1" text="{{'Finished' |L}}" class="class-btn" *ngIf="showFinishedButton" isEnabled="false"
      style="opacity:1;background-color: #88abd1"></Button>
    <Button col="1" text="{{'downloadCertificate' |L}}" class="class-btn" *ngIf="showCertificateButton"
      (tap)="downloadCertificate()"></Button>
    <Button col="1" text="{{'Enrolled' |L}}" class="class-btn" *ngIf="showAlredyEnrolledButton"></Button>
    <label col="0" horizontalAlignment="left" [ngClass]="webinar?.webinar?.isFavorite ? 'fas' : 'far'" text="&#xf004;"
      style="color: #1056A5; margin-top: 5; font-size: 25; width: 40; height: 40;; margin: 0 20 0 0"
      (tap)="toggleFavorite(webinar.webinar.isFavorite)"> </label>

  </GridLayout>

</GridLayout>
