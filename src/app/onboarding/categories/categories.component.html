<GridLayout class="whiteback" >
    <!-- <Image src="~/images/on1.png" scaleX="1.6" scaleY="1.4" fill="aspectFill"></Image> -->

    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

        <StackLayout>

    <StackLayout class=" my-back-on" height="330">
        <FlexboxLayout flexDirection="row-reverse" class="container" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label  text="{{'Back'| L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 40;"  alignItems="center" justifyContent="center">
            <StackLayout class="prog" >
                <label text="1" class="prog-label" ></label>
            </StackLayout>

            <StackLayout class="prog-bar" >
            </StackLayout>

            <StackLayout class="prog" >
                <label text="2" class="prog-label" ></label>
            </StackLayout>

            <StackLayout class="prog-bar" >
            </StackLayout>
            
            <StackLayout class="prog" >
                <label text="3" class="prog-label" ></label>
            </StackLayout>

        </FlexboxLayout>

        <StackLayout class="on-icon-back" >
            <label text="&#xf02d;" class="fas on-icon" ></label>
        </StackLayout>
       

     </StackLayout>
  
      
      <label  text="{{'interests' |L}}" class="sign-label container" style="margin-bottom: 0; margin-top: 0;"></label>
      <label   text="{{'intereststext' |L}}" style="margin-bottom: 10;" class="forget-text container"></label>
      
      <ScrollView class="container"  scrollBarIndicatorVisible="false">

        <StackLayout style="margin-bottom: 50;" >

      <StackLayout *ngFor="let tag of tags" [ngClass]="{'cate':!(selectedInterests?.includes(tag.id)), 'cate-active' : selectedInterests?.includes(tag.id) }">
        <Label text="{{tag.nameAr}}" class="" style="text-align: center;" (tap)="addTag(tag.id)" ></Label>
      </StackLayout>

      
      </StackLayout>

      </ScrollView>

  

    </StackLayout>

    <GridLayout verticalAlignment="bottom" class="container" style="background-color: #fff; padding:0 0 10 0;">
        <Button verticalAlignment="bottom"  text="{{'continue1' |L}}" class="login-btn" [isEnabled]="selectedInterests?.length>0" (tap)="saveTags()"></Button>
     </GridLayout>

  </GridLayout>
