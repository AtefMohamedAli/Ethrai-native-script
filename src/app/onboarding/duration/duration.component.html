<GridLayout class="whiteback"  >
    <!-- <Image src="~/images/on1.png" scaleX="1.6" scaleY="1.4" fill="aspectFill"></Image> -->

    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

        <StackLayout>

    <StackLayout class="my-back-on2" height="330">
        <FlexboxLayout flexDirection="row-reverse" class="container" style="margin-top: 45;"  alignItems="center" justifyContent="flex-end" (tap)="goBack()">
            <label text="{{'Back' |L}}"  style="font-size: 16px; color: #1056A5; font-weight: 500; margin-left: 5;"></label>
            <Image src="~/images/back.png" width="18" class="" ></Image>
        </FlexboxLayout>

        <FlexboxLayout flexDirection="row-reverse" style="margin-top: 40;"  alignItems="center" justifyContent="center">
            <StackLayout class="prog" style="border-width: 5;" >
                <label text="&#xf00c;" class=" fas prog-label"></label>
            </StackLayout>

            <StackLayout class="prog-bar2" >
            </StackLayout>

            <StackLayout class="prog" >
                <label text="2" class="prog-label" ></label>
            </StackLayout>

            <StackLayout class="prog-bar" >
            </StackLayout>
            
            <StackLayout class="prog" >
                <label text="3" class="prog-label" ></label>
            </StackLayout>

        </FlexboxLayout>

        <StackLayout class="on-icon-back" >
            <label text="&#xf2f2;" class="fas on-icon" ></label>
        </StackLayout>
       

     </StackLayout>
  
      
      <label text="{{'prefduration' |L}}" class="sign-label container" style="margin-bottom: 0; margin-top: 0;"></label>
      <label  text="{{'prefdurationtext' |L}}" style="margin-bottom: 10;" class="forget-text container"></label>
      
      <ScrollView scrollBarIndicatorVisible="false" class="container">

        <StackLayout style="margin-bottom: 50;" >

        <label text="{{item.nameAr}} {{'hours' |L}}"  *ngFor="let item of durations"  (tap)="addDuration(item.id)"
        [ngClass]="{'cate':!(selectedDurations?.includes(item.id)), 'cate-active' : selectedDurations?.includes(item.id) }"></label>

        <label text="الكل" (tap)="addDuration('all')"
        [ngClass]="{'cate':!(selectedDurations?.includes('all')), 'cate-active' : selectedDurations?.includes('all') }"></label>

      </StackLayout>

      </ScrollView>

  

    </StackLayout>

    <GridLayout verticalAlignment="bottom" class="container" style="background-color: #fff; padding:0 0 10 0;">
        <Button verticalAlignment="bottom"   (tap)="save()" text="{{'continue1' |L}}" class="login-btn" [isEnabled]="selectedDurations?.length>0"></Button>
     </GridLayout>

  </GridLayout>
