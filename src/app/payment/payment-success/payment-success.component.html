<GridLayout class="view" >
    
    <ActionBar  visability="collapsed"  class="view" title="">   </ActionBar>    

    <ScrollView  scrollBarIndicatorVisible="false">
      
      <StackLayout>
     
        <StackLayout class="" style="margin-top: 100; text-align: center;" >
            <label style="color: #58a667; font-size: 100;" text="&#xf118;" class="far forget-icon" ></label>
        </StackLayout>

        <StackLayout style="text-align: center;">
          <label  text="{{'paymentsuccess'| L}}" class="sign-label" style="margin-bottom: 0;"></label>
          <label  text="{{'paymentsuccesstext'| L}}" class="forget-text"></label>
          <Button text="{{'startlearn' | L}}"  style="margin-top: 20;" class="login-btn" (tap)="goToCourse()" ></Button>
        </StackLayout>
  
  
      </StackLayout>
    </ScrollView>
  </GridLayout>
